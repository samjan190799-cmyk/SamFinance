name: Deploy SamFinance to TestFlight

# Подписывает приложение через ключ App Store Connect API и загружает сборку в App Store Connect (TestFlight).
# Запуск: вручную (gh workflow run testflight.yml) или пушем тега вида v1.0.0.
# Ручной запуск доступен, когда этот файл лежит в ветке по умолчанию.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  # Team ID из Apple Developer -> Membership details
  TEAM_ID: V7J345DY58
  SCHEME: SamFinance

jobs:
  upload:
    name: Archive, Sign & Upload
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check Secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Секрет $name не задан в Settings -> Secrets and variables -> Actions"
              missing=1
            fi
          done
          exit $missing

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Latest Release Xcode
        run: |
          # Бета и RC пропускаем: App Store не принимает сборки, сделанные бета-SDK
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|candidate' | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Write App Store Connect API Key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive (Signed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          # Подпись в project.yml отключена для CI-сборки IPA, поэтому здесь включаем её явно.
          # Номер сборки = номер запуска workflow, чтобы каждая загрузка была новой.
          xcodebuild archive \
            -project SamFinance.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SamFinance.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tee build/archive.log

      - name: Export and Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/SamFinance.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove API Key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
