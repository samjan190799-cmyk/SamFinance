name: Deploy SamFinance to TestFlight

# Подписывает приложение через ключ App Store Connect API и загружает сборку в App Store Connect (TestFlight).
# Запуск: вручную (gh workflow run testflight.yml) или пушем тега вида v1.0.0.
# Ручной запуск доступен, когда этот файл лежит в ветке по умолчанию.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  # Team ID из Apple Developer -> Membership details
  TEAM_ID: V7J345DY58
  SCHEME: SamFinance

jobs:
  upload:
    name: Archive, Sign & Upload
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check Secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Секрет $name не задан в Settings -> Secrets and variables -> Actions"
              missing=1
            fi
          done
          exit $missing

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Latest Release Xcode
        run: |
          # Бета и RC пропускаем: App Store не принимает сборки, сделанные бета-SDK
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|candidate' | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Write App Store Connect API Key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Inject AI Settings
        # Ключ, сервис и модель ИИ-чата берутся из секретов GitHub (Settings → Secrets and variables → Actions):
        #   AI_API_KEY  — ключ API (без него в сборке нет облачного ИИ, чат отвечает локальным помощником);
        #   AI_PROVIDER — gemini или claude (необязательно, по умолчанию gemini);
        #   AI_MODEL    — название модели (необязательно, по умолчанию стандартная модель сервиса).
        # Значения кладутся в Info.plist после xcodegen, который его перезаписывает. В xcodebuild ключ не передаётся:
        # параметры команды печатаются в журнал, а журнал сборки при падении выгружается артефактом без маскировки.
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::warning::Секрет AI_API_KEY не задан: в этой сборке ИИ-чат работает без облака, только локальный помощник"
          else
            echo "Ключ ИИ задан, он будет встроен в сборку"
          fi
          PLIST=Sources/Info.plist
          # Delete + Add, а не Set: работает и тогда, когда xcodegen пустое значение в plist не записал
          set_plist() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 string \"$2\"" "$PLIST"
          }
          set_plist AIAPIKey "$AI_API_KEY"
          set_plist AIProviderName "$AI_PROVIDER"
          set_plist AIModelName "$AI_MODEL"
          # Проверка без печати значений: ключи на месте, ключ API не пустой, если секрет задан
          /usr/libexec/PlistBuddy -c "Print :AIAPIKey" "$PLIST" > /dev/null
          /usr/libexec/PlistBuddy -c "Print :AIProviderName" "$PLIST" > /dev/null
          /usr/libexec/PlistBuddy -c "Print :AIModelName" "$PLIST" > /dev/null
          if [ -n "$AI_API_KEY" ] && [ -z "$(/usr/libexec/PlistBuddy -c 'Print :AIAPIKey' "$PLIST")" ]; then
            echo "::error::Ключ ИИ не попал в Info.plist"
            exit 1
          fi

      - name: Inject Ads Settings
        # Идентификатор баннерного блока Яндекс Рекламы берётся из секрета GitHub YANDEX_ADS_BANNER_ID и кладётся в Info.plist.
        #   R-M-<число>-<число> — боевой блок из партнёрского интерфейса Яндекса;
        #   demo-banner-yandex  — демо-блок для проверки интеграции (тестовая реклама, в статистику не идёт);
        #   пусто               — в сборке нет рекламы совсем (ни SDK, ни запроса отслеживания).
        # Боевой блок нельзя проверять собственными нажатиями на рекламу: для проверки используйте демо-блок.
        env:
          YANDEX_ADS_BANNER_ID: ${{ secrets.YANDEX_ADS_BANNER_ID }}
        run: |
          PLIST=Sources/Info.plist
          if [ -z "$YANDEX_ADS_BANNER_ID" ]; then
            echo "::warning::Секрет YANDEX_ADS_BANNER_ID не задан: в этой сборке нет рекламы"
          elif [ "$YANDEX_ADS_BANNER_ID" = "demo-banner-yandex" ]; then
            echo "::warning::В сборке демо-блок Яндекс Рекламы: показывается тестовая реклама, дохода нет"
          else
            echo "Рекламный блок задан, он будет встроен в сборку"
          fi
          /usr/libexec/PlistBuddy -c "Delete :YandexAdsBannerUnitID" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :YandexAdsBannerUnitID string \"${YANDEX_ADS_BANNER_ID}\"" "$PLIST"
          # Проверка без печати значения: ключ на месте, а список SKAdNetwork и текст запроса отслеживания не потерялись
          /usr/libexec/PlistBuddy -c "Print :YandexAdsBannerUnitID" "$PLIST" > /dev/null
          /usr/libexec/PlistBuddy -c "Print :SKAdNetworkItems:0:SKAdNetworkIdentifier" "$PLIST" > /dev/null
          /usr/libexec/PlistBuddy -c "Print :NSUserTrackingUsageDescription" "$PLIST" > /dev/null

      - name: Archive (Signed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          # Подпись в project.yml отключена для CI-сборки IPA, поэтому здесь включаем её явно.
          # Номер сборки = номер запуска workflow, чтобы каждая загрузка была новой.
          xcodebuild archive \
            -project SamFinance.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SamFinance.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tee build/archive.log

      - name: Check Privacy Manifests
        # Apple проверяет манифесты приватности после отправки на проверку; нарушение ставит версии «Ошибка двоичного файла»
        # (ITMS-91064, TN3181). Те же правила проверяются здесь, до загрузки: упавший шаг дешевле отклонённой версии.
        run: |
          python3 - <<'PY'
          import os, plistlib, re, sys
          app = "build/SamFinance.xcarchive/Products/Applications/SamFinance.app"
          problems, count = [], 0
          for folder, _, names in os.walk(app):
              for name in names:
                  if name != "PrivacyInfo.xcprivacy":
                      continue
                  full = os.path.join(folder, name)
                  path = os.path.relpath(full, app)
                  count += 1
                  try:
                      with open(full, "rb") as handle:
                          manifest = plistlib.load(handle)
                  except Exception as error:
                      problems.append(f"{path}: не читается ({error})")
                      continue
                  tracking = manifest.get("NSPrivacyTracking")
                  domains = manifest.get("NSPrivacyTrackingDomains", [])
                  print(f"{path}: tracking={tracking} domains={domains}")
                  if tracking is not None and not isinstance(tracking, bool):
                      problems.append(f"{path}: NSPrivacyTracking должен быть Boolean")
                  if not isinstance(domains, list) or not all(isinstance(item, str) for item in domains):
                      problems.append(f"{path}: NSPrivacyTrackingDomains должен быть массивом строк")
                      continue
                  if tracking is True and not domains:
                      problems.append(f"{path}: NSPrivacyTracking = true, а список доменов пуст")
                  if tracking is not True and domains:
                      problems.append(f"{path}: есть домены отслеживания, а NSPrivacyTracking не true")
                  for domain in domains:
                      if not re.fullmatch(r"[A-Za-z0-9.-]+", domain):
                          problems.append(f"{path}: неверный домен {domain!r} (без схемы, пути и слеша)")
          if count == 0:
              problems.append("в приложении нет ни одного манифеста приватности")
          print(f"Манифестов приватности: {count}")
          for problem in problems:
              print("::error::" + problem)
          sys.exit(1 if problems else 0)
          PY

      - name: Show Archived Version
        # Диагностика: какая версия и номер сборки реально попали в архив (App Store отклоняет уже закрытые версии)
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" \
            build/SamFinance.xcarchive/Products/Applications/SamFinance.app/Info.plist || true

      - name: Export and Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/SamFinance.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove API Key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
