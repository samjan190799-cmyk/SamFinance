name: App Store Preview Video

# Записывает ролик для App Store (App Preview): отладочная сборка на симуляторе iPhone Pro Max проигрывает сценарий
# (Sources/Helpers/ScreenshotMode.swift, аргумент -ScreenshotTour), экран пишется simctl, затем ffmpeg приводит запись
# к требованиям Apple: 886x1920, H.264, 30 кадров/с, 15-30 секунд, стерео AAC. По ролику на русском, английском и армянском.
# Результат лежит в артефакте app-preview вместе с контрольными кадрами. Запуск: вручную или правкой файлов из paths.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/app-preview.yml'
      - 'Sources/Helpers/ScreenshotMode.swift'

permissions:
  contents: read

jobs:
  preview:
    name: Record Preview
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen and FFmpeg
        run: brew install xcodegen ffmpeg

      - name: Select Latest Xcode (Xcode 16+ for Swift 6)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|candidate' | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Pick a Pro Max Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data, reverse=True):
              if 'iOS' not in runtime:
                  continue
              version = runtime.rsplit('iOS-', 1)[-1].split('-')
              if int(version[0]) < 17:
                  continue
              for device in sorted(data[runtime], key=lambda d: d['name'], reverse=True):
                  if 'Pro Max' in device['name'] and device['isAvailable']:
                      print(device['udid'])
                      sys.exit(0)
          sys.exit('Нет симулятора iPhone Pro Max')
          ")
          echo "Simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Boot Simulator
        run: |
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl status_bar "$SIM_UDID" override \
            --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Build Debug App for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project SamFinance.xcodeproj \
            -scheme SamFinance \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Install App
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          echo "BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" >> "$GITHUB_ENV"

      - name: Record Previews
        run: |
          mkdir -p preview raw
          # Режим заданий: без него фоновая запись игнорирует SIGINT и не успевает закрыть файл
          set -m

          record() {
            lang="$1"; locale="$2"; question="$3"
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" \
              -AppleLanguages "($lang)" -AppleLocale "$locale" \
              -ScreenshotTour 1 -ScreenshotQuestion "$question" > /dev/null
            # Запись начинается сразу после запуска; сценарий стартует через 5 секунд и идёт около 28
            xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force "raw/$lang.mp4" &
            REC_PID=$!
            sleep 38
            kill -INT "$REC_PID"
            wait "$REC_PID" || true
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
          }

          record ru ru_RU "Сколько я потратил за неделю?"
          record en en_US "How much did I spend this week?"
          record hy hy_AM "Որքա՞ն եմ ծախսել այս շաբաթ"

          for lang in ru en hy; do
            echo "== raw $lang"
            ffprobe -v error -select_streams v:0 -count_frames \
              -show_entries stream=width,height,nb_read_frames,duration -of default=nw=1 "raw/$lang.mp4"
          done

      - name: Encode for App Store
        run: |
          # START — сколько секунд записи отрезать в начале; LENGTH — длина готового ролика (Apple: 15-30 с)
          START="${PREVIEW_START:-3.5}"
          LENGTH="${PREVIEW_LENGTH:-29}"
          for lang in ru en hy; do
            ffmpeg -y -v error -ss "$START" -i "raw/$lang.mp4" \
              -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=48000" \
              -t "$LENGTH" \
              -vf "scale=886:1920:flags=lanczos,fps=30,format=yuv420p" \
              -c:v libx264 -profile:v high -level 4.0 -b:v 10M -maxrate 12M -bufsize 20M \
              -c:a aac -b:a 256k -ar 48000 -ac 2 -shortest -movflags +faststart \
              "preview/hashiv_preview_$lang.mp4"
            echo "== $lang"
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,sample_rate,channels:format=duration,size \
              -of default=nw=1 "preview/hashiv_preview_$lang.mp4"
            # Контрольные кадры: по одному каждые 2 секунды
            ffmpeg -y -v error -i "preview/hashiv_preview_$lang.mp4" \
              -vf "fps=1/2,scale=222:-1,tile=8x2" -frames:v 1 "preview/sheet_$lang.jpg"
          done
          ls -l preview

      - name: Upload Preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-preview
          path: preview
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Raw Recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-preview-raw
          path: raw
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
